# GitHub Actions → GHCR → (deploy/k8s 이미지 태그 커밋) → Argo CD → k3s
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://copilot:copilot@localhost:5432/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build          # 타입 검사 포함

  images:
    needs: [test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 경로 (GHCR은 소문자만 허용)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: api 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/research-copilot-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/research-copilot-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: web 이미지
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/research-copilot-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/research-copilot-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # GitOps: 매니페스트의 이미지 태그를 이번 커밋 SHA로 바꿔 커밋한다. Argo CD가 이걸 보고 배포한다.
  bump-manifests:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: kustomization 이미지 태그 갱신
        working-directory: deploy/k8s
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          kustomize edit set image \
            "research-copilot-api=${prefix}/research-copilot-api:${GITHUB_SHA}" \
            "research-copilot-web=${prefix}/research-copilot-web:${GITHUB_SHA}"
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: images ${GITHUB_SHA::7} [skip ci]"
          git push

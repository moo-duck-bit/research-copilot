# 예시 파일. 실제 값을 넣어 Git에 올리지 말 것(kustomization에 포함되지 않는다).
# 클러스터에서 직접 만든다:
#   kubectl -n research-copilot create secret generic copilot-secrets \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=VOYAGE_API_KEY=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://copilot:<비밀번호>@postgres:5432/copilot'
apiVersion: v1
kind: Secret
metadata:
  name: copilot-secrets
  namespace: research-copilot
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<anthropic key>"
  VOYAGE_API_KEY: "<voyage key>"
  POSTGRES_PASSWORD: "<db password>"
  DATABASE_URL: "postgresql+asyncpg://copilot:<db password>@postgres:5432/copilot"

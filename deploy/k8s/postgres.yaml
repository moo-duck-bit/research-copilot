apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None              # StatefulSet용 헤드리스 서비스
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: copilot
            - name: POSTGRES_DB
              value: copilot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copilot-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA                  # 볼륨 최상단의 lost+found를 피해 하위 폴더에 둔다
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "copilot", "-d", "copilot"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "copilot", "-d", "copilot"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # 실측은 유휴 50MiB, 부하 최대 74MiB(데이터가 작다). shared_buffers 기본 128MB와
            # HNSW 인덱스 생성(maintenance_work_mem)을 감안해 여유를 둔다.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi              # k3s 기본 local-path 스토리지클래스 사용
